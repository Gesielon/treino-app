<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d7a5a">
<meta name="description" content="Treino de hipertrofia A/B com cronômetro, registro de cargas e sugestões de progressão.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<script>window.STANDALONE=true;</script>
<title>Treino A/B</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: ficha de academia em coluna única; abas por treino; cartões com desenho; barra de cronômetro fixa embaixo */
:root{
  --bg:#eef2f0; --surface:#ffffff; --ink:#16201c; --muted:#5a6863; --line:#d3dcd8;
  --ghost:#b9c6c1; --eq:#9aa9a3; --eqfill:#e3eae7; --accent:#0d7a5a; --accent-soft:#d8efe6; --on-accent:#ffffff;
  --over:#b45309; --over-soft:#fdecd3; --done:#7b8a84;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18201d; --ink:#e4ebe8; --muted:#94a39d; --line:#2b3632;
  --ghost:#4a5853; --eq:#5d6d67; --eqfill:#222c28; --accent:#41c495; --accent-soft:#16332a; --on-accent:#08130f;
  --over:#f5a524; --over-soft:#3a2a10; --done:#6f7d78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18201d; --ink:#e4ebe8; --muted:#94a39d; --line:#2b3632;
  --ghost:#4a5853; --eq:#5d6d67; --eqfill:#222c28; --accent:#41c495; --accent-soft:#16332a; --on-accent:#08130f;
  --over:#f5a524; --over-soft:#3a2a10; --done:#6f7d78; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
button,input,select,label,a,summary{touch-action:manipulation}
/* Cartões fora da tela não são desenhados até chegar perto: rolagem mais leve */
.card{content-visibility:auto;contain-intrinsic-size:auto 620px}
.timer{contain:layout paint;transform:translateZ(0)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(175px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1;margin:0;text-transform:uppercase}
.sub{color:var(--muted);margin:4px 0 0;font-size:.85rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ghostbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:600}
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;overflow-x:auto}
.tab{flex:1 1 0;min-width:0;border:1px solid var(--line);background:var(--surface);font-family:var(--display);
  font-weight:700;font-size:1.15rem;padding:7px 2px;border-radius:10px;line-height:1.1;white-space:nowrap}
.tab small{display:block;font-family:var(--body);font-weight:500;font-size:.66rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tab[aria-selected="true"] small{color:var(--on-accent);opacity:.85}
.tab .nx{color:var(--over);font-weight:700}
.tab[aria-selected="true"] .nx{color:var(--on-accent)}
.dayhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-end}
.dayhead h2{font-family:var(--display);font-size:1.6rem;margin:0;text-transform:uppercase;line-height:1.05}
.dayhead p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.sess{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.sess.late{border-color:var(--over);color:var(--over)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;vertical-align:middle;margin-right:5px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px;scroll-margin-top:70px}
.card.cur{border:2px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.card.done{background:transparent}
.card.done h3{color:var(--done);text-decoration:line-through;text-decoration-thickness:2px}
.chead{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.chead h3{font-family:var(--display);font-size:1.35rem;margin:0;line-height:1.1;text-transform:uppercase;text-wrap:balance;min-width:0}
.num{color:var(--accent);margin-right:6px}
.badge{font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.badge.now{background:var(--accent);color:var(--on-accent)}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.dose{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:.8rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.rest{color:var(--muted);font-weight:500}
.vars{display:flex;flex-direction:column;gap:5px}
.vars span{font-size:.75rem;color:var(--muted);font-weight:600}
.varrow{display:flex;gap:6px;flex-wrap:wrap}
.vbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;font-size:.78rem;font-weight:600;text-align:left}
.vbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.fig{width:100%;max-width:340px;align-self:center;aspect-ratio:200/150;display:block}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:.9rem}
details.tips summary{font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer}
details.tips ul{margin-top:6px}
.sets{display:flex;gap:8px}
.set{flex:1;min-height:52px;border-radius:10px;border:2px dashed var(--line);background:var(--bg);font-weight:700;font-size:.9rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.set small{font-weight:500;font-size:.68rem;color:var(--muted)}
.set.next{border:2px solid var(--accent);color:var(--accent)}
.set.next small{color:var(--accent)}
.set.ok{border:2px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.set.ok small{color:var(--on-accent);opacity:.85}
.set:disabled{opacity:.45;cursor:default}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;font-size:.85rem;font-weight:600;color:var(--accent);border-bottom:1.5px solid currentColor}
.vid{font-size:.85rem;font-weight:600;color:var(--accent);text-decoration:none;border-bottom:1.5px solid currentColor}
.warm{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.9rem}
.warm.ok{background:transparent;color:var(--muted)}
.prim{border:0;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:9px 14px;font-weight:700;font-size:.88rem}
.finish{display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--accent-soft);border-radius:14px;padding:14px}
.finish b{font-family:var(--display);font-size:1.3rem;text-transform:uppercase}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:.9rem}
.note h3{font-family:var(--display);font-size:1.25rem;text-transform:uppercase;margin:0 0 6px}
.note ul,.note ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.note p{margin:0 0 6px}
.flag{font-size:.8rem;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:8px}
.week div{border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center;font-size:.72rem;color:var(--muted);line-height:1.2}
.week div b{display:block;font-family:var(--display);font-size:1.05rem;color:var(--ink)}
.week div.g{background:var(--accent-soft);border-color:var(--accent)}
.week div.g b{color:var(--accent)}
.fig{width:100%;max-width:240px}
.varsel{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--muted);font-weight:600}
.varsel select{font:inherit;font-size:.85rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;max-width:100%}
.pill.fail{border-color:transparent}
.pill.fsim{background:var(--accent-soft);color:var(--accent)}
.pill.f1-2,.pill.fcasa{background:var(--over-soft);color:var(--over)}
.pill.f2-3{background:var(--over);color:var(--surface)}
.ev{font-size:.84rem;border-radius:10px;padding:8px 10px;background:var(--bg);border-left:4px solid var(--muted);line-height:1.4}
.ev.up{border-left-color:var(--accent)} .ev.down{border-left-color:var(--over)}
.ev.up b{color:var(--accent)} .ev.down b{color:var(--over)}
.ev.swap{border-left-color:var(--accent);background:var(--accent-soft)} .ev.swap b{color:var(--accent)}
.swaps{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.swaps .vbtn{background:var(--surface)}
.evsets{color:var(--muted);font-size:.78rem;margin-top:3px;font-variant-numeric:tabular-nums}
.basew{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:.88rem}
.rows{display:flex;flex-direction:column;gap:6px}
.rhead,.row{display:grid;grid-template-columns:22px minmax(0,1.15fr) minmax(0,1fr) 52px;gap:5px;align-items:center}
.row.bw,.rows:has(.row.bw) .rhead{grid-template-columns:22px minmax(0,1fr) 52px}
.rhead span{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center}
.row{padding:5px;border-radius:10px;border:1px solid transparent}
.row.next{border-color:var(--accent);background:var(--accent-soft)}
.row.ok{opacity:.8}
.sn{font-weight:700;font-size:.85rem;color:var(--muted);text-align:center}
.stp{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden;min-width:0}
.stp button{border:0;background:var(--bg);width:26px;flex:none;font-size:1.15rem;font-weight:700;color:var(--accent)}
.stp input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:.9rem;letter-spacing:-.02em;text-align:center;padding:6px 0;font-variant-numeric:tabular-nums}
.stp .u{align-self:center;font-size:.68rem;color:var(--muted);padding:0 3px 0 1px;min-width:0}
.basew .stp{width:170px}
.chk{height:40px;border-radius:9px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:700;font-size:.82rem}
.row.ok .chk{background:var(--accent);color:var(--on-accent);font-size:1.1rem}
.chk:disabled{border-color:var(--line);color:var(--muted);cursor:default}
details.tips .flag{margin:6px 0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td:first-child{white-space:normal;min-width:120px}
td.pos{color:var(--accent);font-weight:700} td.neg{color:var(--over);font-weight:700}
.dot{font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--bg)}
.dot.up{background:var(--accent-soft);color:var(--accent)} .dot.down{background:var(--over-soft);color:var(--over)}
.chk4{display:flex;flex-direction:column;gap:6px}
.pchk{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:.88rem;font-weight:600}
.pchk span{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--accent);display:grid;place-items:center;color:var(--on-accent);font-weight:800}
.pchk.on{border-color:var(--accent);background:var(--accent-soft)} .pchk.on span{background:var(--accent)}
.bwrow,.bwq{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bwrow input,.bwq input,.hm input{font:inherit;font-weight:700;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 9px;min-width:0}
.bwrow input[type=text],.bwq input{width:90px}
.hm{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)} .hm input{width:72px;text-align:center;font-variant-numeric:tabular-nums}
.hm input:invalid{border-color:var(--over)}
.remrow{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:6px}
.tog{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.9rem;cursor:pointer}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tog span{flex:none;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.tog span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s}
.tog input:checked+span{background:var(--accent)} .tog input:checked+span::after{transform:translateX(18px)}
.tog input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
a.prim{text-decoration:none;display:inline-block}
.figrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px}
.figrow .fig{max-width:220px;justify-self:center}
.bigt{font-family:var(--display);font-weight:700;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent);min-width:3.3ch;text-align:right}
.bigt.idle{color:var(--ghost)} .bigt.over{color:var(--over)}
.pick{scroll-margin-top:70px;border:2px dashed var(--accent);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.pickhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pickhead b{font-family:var(--display);font-size:1.3rem;text-transform:uppercase}
.pickhead .bigt{font-size:2.8rem}
.pickrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pcard{position:relative;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:22px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pcard .fig{max-width:100%}
.pcard .ord{position:absolute;top:6px;left:8px;font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--muted)}
.pcard .pn{font-size:.78rem;font-weight:700;text-align:center;line-height:1.2;text-wrap:balance}
.pcard .pr{font-size:.66rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.pcard.best{border:3px solid var(--accent);background:var(--accent-soft)} .pcard.best .ord{color:var(--accent)}
/* cronômetro */
.trem{max-width:720px;margin:0 auto 6px;font-size:.8rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;min-height:1.2em}
.trem.late{color:var(--over)}
.pill.plus{background:var(--accent);color:var(--on-accent);border-color:transparent}
.pill.minus{background:var(--over-soft);color:var(--over);border-color:transparent}
ul.adj{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px}

.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.tin{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.tinfo{flex:1;min-width:0}
.tlabel{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.tsub{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbig{font-family:var(--display);font-weight:700;font-size:2.9rem;line-height:1;font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.tbar{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);width:100%;transform:scaleX(0);transform-origin:left center;will-change:transform}
.tbtns{display:flex;flex-direction:column;gap:5px}
.tbtns button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:.78rem;font-weight:700}
.timer.over{background:var(--over-soft);border-top-color:var(--over)}
.timer.over .tlabel,.timer.over .tbig{color:var(--over)}
.timer.idle .tbig{color:var(--muted);font-size:1.6rem}
.timer.idle .tlabel{color:var(--muted)}
@media (prefers-reduced-motion: no-preference){
  .timer.over .tbig{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}}
/* desenho */
.limb{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.head{fill:currentColor}
.pr{stroke:currentColor;fill:none;stroke-linecap:round}
.fl{fill:currentColor}
.pa{color:var(--ghost)} .pb{color:var(--ink)}
.eq{stroke:var(--eq);fill:var(--eqfill);stroke-width:2;stroke-linecap:round}
.eql{stroke:var(--eq);fill:none;stroke-linecap:round}
.arr{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ah)}
#ah path{fill:var(--accent)}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs></svg>

<div class="wrap">
  <div class="top">
    <div><h1>Treino A/B</h1><p class="sub">Corpo inteiro · 55 min · peso e repetições de cada série</p></div>
    <button class="ghostbtn" id="soundBtn" type="button">Som: ligado</button>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="content"></main>
</div>

<div class="timer idle" id="timer" aria-live="polite">
  <div class="trem" id="tRem"></div>
  <div class="tin">
    <div class="tinfo"><div class="tlabel" id="tLabel">Cronômetro</div><div class="tsub" id="tSub">Terminou uma série? Toque nela para o descanso começar.</div><div class="tbar"><i id="tBar"></i></div></div>
    <div class="tbig" id="tBig">--:--</div>
    <div class="tbtns" id="tBtns" hidden><button type="button" id="tPlus">+15 s</button><button type="button" id="tSkip">Pular</button></div>
  </div>
</div>

<script>
const mir=p=>[200-p[0],p[1]];

function pose(p,cls){
  if(!p) return '';
  let s=`<g class="${cls}">`;
  p.L.forEach(l=>s+=`<polyline points="${pts(l)}" class="limb"/>`);
  s+=`<circle cx="${p.h[0]}" cy="${p.h[1]}" r="9" class="head"/>`+(p.x||'')+'</g>';
  return s;
}
function svg(k){
  const e=EX[k];
  return `<svg class="fig" viewBox="0 0 200 150" role="img" aria-label="Desenho: ${e.n}">${e.eq||''}${pose(e.a,'pa')}${pose(e.b,'pb')}${e.arr.map(d=>`<path d="${d}" class="arr"/>`).join('')}</svg>`;
}

// ---- plano do dia: ordem e séries ----
// 1) Ordem: a mesma em que você fez esse treino da última vez.
// 2) Compensação: o que ficou faltando no último treino ganha séries extras hoje (máx. +2),
//    tiradas de exercícios pequenos (abdômen, bíceps, tríceps, ombro isolado), para não aumentar o tempo.
// 3) Correção: exercício grande vem antes do pequeno do mesmo músculo (ex.: supino antes do tríceps).
function computePlan(d){
  const n=d.items.length,sets=d.items.map(it=>it.sets),notes=[],carry=[];

  if(d.kind==='gym'&&deloadOn()){d.items.forEach((it,k)=>{sets[k]=Math.min(2,it.sets)});notes.push(`<b>Semana leve até ${br(addD(S.deload.until,-1))}:</b> 2 séries por exercício, mesma carga, parando 2 a 3 repetições antes da falha.`)}
  const debt=d.kind==='gym'&&S.debt&&!deloadOn()?S.debt.items:[],tot={},front=[],noSlot=[],noTime=[];
  debt.forEach(x=>{tot[x.g]=(tot[x.g]||0)+x.miss});
  // Tempo: usa primeiro a folga até 55 min (com 3 min de margem para esperar aparelho); depois tira séries de exercícios pequenos.
  const secs=()=>{let t=d.kind==='gym'?300:0;d.items.forEach((it,k)=>{t+=sets[k]*45+(sets[k]-1)*it.rest+(k?TRANS[d.kind]:0)});return t};
  let budget=55*60-180-secs();
  const RANK=['legs','back','chest','shoulders','tri','bi','core'],groups=RANK.filter(g=>tot[g]),tgt={},add={},gave={};
  groups.forEach(g=>{const c=order.filter(i=>GRP[d.items[i].ex]===g).sort((a,b)=>isComp(d.items[b].ex)-isComp(d.items[a].ex));
    if(c.length){tgt[g]=c[0];add[g]=0;gave[g]=[]}else noSlot.push(g)});
  const targets=Object.values(tgt);
  for(const pass of [1,2])for(const g of groups){const t=tgt[g];if(t===undefined||Math.min(2,tot[g])<pass||sets[t]+add[g]>=5)continue;
    const cost=45+d.items[t].rest;
    if(budget>=cost){budget-=cost;add[g]++;continue}
    let j=-1;for(const dg of DONOR){if(tot[dg])continue;j=order.find(k=>!targets.includes(k)&&!isComp(d.items[k].ex)&&GRP[d.items[k].ex]===dg&&sets[k]>2);if(j!==undefined&&j>=0)break;j=-1}
    if(j<0)continue;
    sets[j]--;budget+=45+d.items[j].rest-cost;add[g]++;gave[g].push(j)}
  groups.forEach(g=>{const t=tgt[g];if(t===undefined)return;
    if(!add[g]){noTime.push(g);return}
    sets[t]+=add[g];front.push(t);
    notes.push(`<b>+${add[g]} série${add[g]>1?'s':''} em ${EX[exKey(d,t)].n}</b> para compensar ${GN[g]}, que ficou faltando no último treino. ${gave[g].length?`Para caber em 55 min: −1 série em ${gave[g].map(j=>EX[exKey(d,j)].n).join(' e ')}.`:'Cabe na folga dos 55 min.'} Vem no começo do treino, para não ficar de fora de novo.`)});
  noSlot.forEach(g=>carry.push(...debt.filter(x=>x.g===g)));
  noTime.forEach(g=>carry.push(...debt.filter(x=>x.g===g)));
  if(noSlot.length)notes.push(`${noSlot.map(g=>GN[g]).join(' e ')}: não há exercício desse grupo neste treino; a compensação fica para o próximo.`);
  if(noTime.length)notes.push(`${noTime.map(g=>GN[g]).join(' e ')}: não coube hoje sem passar de 55 min; a compensação fica para o próximo.`);
  front.reverse().forEach(t=>{order=[t,...order.filter(x=>x!==t)]});
  const moved=[];let changed=true,guard=0;
  while(changed&&guard++<20){changed=false;
    for(let x=0;x<order.length&&!changed;x++){const I=d.items[order[x]].ex;if(isComp(I))continue;

  return {order,sets,notes,carry};
}

// ---- regra de progressão (dupla progressão) ----
// Avalia pelo peso da 1ª série. Todas as séries no topo da faixa → sobe a carga.
// 1ª série abaixo do mínimo → baixa a carga. No meio → mantém e tenta +1 repetição.
// Estimativa de carga para outra faixa de repetições (fórmula de Epley). É aproximada, menos precisa acima de ~15 repetições;
// por isso a mudança é limitada a +50% ou −30% por treino, e o histórico corrige no treino seguinte.
const roundStep=(k,w)=>Math.round(w/STEP(k))*STEP(k);
function estW(key,w,r,target){const st=STEP(key);let nw=w*(1+r/30)/(1+target/30);

  return Math.round(nw*100)/100}
function evaluate(key,it,sets,pre){
  const [mn,mx]=range(it.reps),sec=isSec(it.reps),bw=BW.includes(key),u=sec?' s':'',st=w0x=>INC(key,w0x);
  const reps=sets.map(s=>+s.r||0),w0=sets[0].w,wDrop=!bw&&sets.some(s=>s.w!==''&&w0!==''&&s.w<w0);
  if(bw){
    if(key==='abd'&&reps.every(r=>r>=mx))return {dir:'up',w:'',msg:`Sem carga, o Remador só progride com mais repetições, e ${mx}+ já passa da faixa de crescimento. Prefira o Abdominal na Polia, onde dá para pôr peso.`};
    if(key==='barraNeg'&&reps.every(r=>r>=mx))return {dir:'up',w:'',msg:`Fez ${mx} descidas em todas. Próximo: tente a Barra Fixa completa.`};
    if(reps.every(r=>r>=mx))return {dir:'up',w:'',msg:sec?`Bateu ${mx} s em todas. Próximo: tente ${mx+10} s.`:`Bateu ${mx} em todas. Próximo: faça mais devagar (3 s para descer) ou passe para uma versão mais difícil.`};
    if(reps[0]<mn)return {dir:'down',w:'',msg:`Abaixo de ${mn}${u} na 1ª série. Use ${EX[key]&&EX[key].easy?'a '+EX[key].easy:'uma versão mais fácil'} até chegar a ${mn}${u}.`};
    return {dir:'keep',w:'',msg:`Mantenha e tente +1${sec?'0 s':' repetição'} nas séries abaixo de ${mx}${u}.`};
  }
  if(w0===''||w0==null)return {dir:'keep',w:'',msg:'Anote o peso para o app conseguir sugerir a carga.'};
  if(!wDrop&&reps[0]>=mx+3){const nw=estW(key,w0,reps[0],(mn+mx)/2);return {dir:'up',w:nw,msg:`Repetições demais: ${reps[0]} na 1ª série, e a faixa é ${mn}–${mx}. Muito acima da faixa, o exercício treina mais resistência do que crescimento. Suba para cerca de ${kg(nw)} kg (estimativa); no próximo treino o app corrige com o que você fizer.`}}
  if(!wDrop&&reps.every(r=>r>=mx)){const nw=w0+st(w0);return {dir:'up',w:nw,msg:`Fez ${mx} ou mais em todas. Suba para ${kg(nw)} kg e volte a mirar ${mn}+.`}}

  if(reps[0]<=mn-3){const nw=estW(key,w0,reps[0],mn+1);return {dir:'down',w:nw,msg:`Poucas repetições: ${reps[0]} na 1ª série, e a faixa é ${mn}–${mx}. Baixe para cerca de ${kg(nw)} kg (estimativa) para fazer de ${mn} a ${mx} com boa técnica.`}}
  if(reps[0]<mn){const nw=Math.max(0,w0-st(w0));return {dir:'down',w:nw,msg:`A 1ª série ficou abaixo de ${mn}. Baixe para ${kg(nw)} kg.`}}

}
// Histórico separado por dia e por exercício escolhido: o Peck Deck no A tem a própria carga, diferente do Peck Deck no B.
// Se ainda não houver registro naquele dia, usa o do outro dia como ponto de partida.
const lastLog=(key,day,strict)=>{const l=S.exlog[key]||[];for(let j=l.length-1;j>=0;j--)if(l[j].day===day)return l[j];return strict||!l.length?null:l[l.length-1]};

// Peso da série: o que você digitou; senão, o da série anterior; na 1ª, a carga sugerida.
function wAt(p,i,s,key,day){for(let k=s;k>=0;k--){const v=p.w[i]?.[k];if(v!==undefined)return v}return sugW(key,day)}

function preOf(d,i){const p=P_(d.id),me=d.items[i].ex,hits=HITS[me]||[GRP[me]];

function remInfo(){

    logExercise(d,i);(p.seq=p.seq||[]).includes(i)||p.seq.push(i);

// Prioridade: séries de compensação > grande antes do pequeno do mesmo músculo > não repetir o músculo que acabou de trabalhar > sua ordem de costume.
function rankNext(d){
  const p=P_(d.id),pl=planOf(d),left=pl.order.filter(i=>(p.sets[i]||0)<pl.sets[i]);
  const lastJ=(p.seq||[]).length?p.seq[p.seq.length-1]:null,lastEx=lastJ==null?null:d.items[lastJ].ex;
  const lastG=lastEx?[GRP[lastEx],...(HITS[lastEx]||[])]:[];
  const score=i=>{const ex=d.items[i].ex,g=GRP[ex];let s=0;
    if(pl.sets[i]>d.items[i].sets)s+=100;
    if(isComp(ex))s+=20;else if(left.some(j=>j!==i&&isComp(d.items[j].ex)&&HITS[d.items[j].ex].includes(g)))s-=50;
    if(lastEx&&(lastG.includes(g)||(HITS[ex]||[]).includes(GRP[lastEx])))s-=30;
    if((p.sets[i]||0)>0)s+=200; // já começado: termine primeiro
    return s-pl.order.indexOf(i)};
  return left.map(i=>[i,score(i)]).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);
}

const TAG={supMaq:'chestPress',pulleySup:'vPull',supino:'chestPress',supHal:'chestPress',supinc:'chestPress',flexao:'chestPress',peck:'chestFly',cruciHal:'chestFly',

const NEED={

const perf=(k,x)=>BW.includes(k)?x.sets.reduce((s,y)=>s+(+y.r||0),0):(+x.sets[0].w||0)*(1+(+x.sets[0].r||0)/30);
const STALL=()=>Math.min(10,Math.max(2,+S.stallN||3));

function stalled(k,day){const N=STALL(),L=(S.exlog[k]||[]).filter(x=>x.day===day&&!x.deload&&(!S.stallReset||x.date>=S.stallReset)).slice(-N);if(L.length<N)return false;

  if(n<=4)return ['ok',`Bom. Cada exercício aparece 2 a 3 vezes por semana, então isso dá cerca de ${sem} semanas sem evoluir antes do aviso.`];
  if(n===5)return ['mid',`Um pouco alto: cerca de ${sem} semanas sem evoluir antes do aviso. Recomendado: 3 a 4.`];

function evoHTML(){

  if(!groups.length)return `<div class="note"><h3>Evolução</h3><p>Ainda sem registros. Quando você terminar as séries de um exercício, ele aparece aqui com a carga do primeiro e do último treino.</p></div>`;
  groups.sort((a,b)=>a.dy.localeCompare(b.dy)||EX[a.k].n.localeCompare(EX[b.k].n));
  const rows=groups.map(({k,dy,L})=>{const f=L[0],l=L[L.length-1],bw=BW.includes(k);

    const diff=(a!==''&&b!=='')?b-a:0;

  return `<div class="note"><h3>Evolução</h3><p class="flag">Por treino e por exercício escolhido. Carga da 1ª série no primeiro e no último registro${groups.some(g=>BW.includes(g.k))?' (peso do corpo: soma das repetições)':''}.</p><div class="tw"><table><thead><tr><th>Dia</th><th>Exercício</th><th>Vezes</th><th>Início</th><th>Último</th><th>Dif.</th><th>Próximo</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;

function guideHTML(){

  const days=[['Seg','A/B',1],['Ter','A/B',1],['Qua','A/B',1],['Qui','A/B',1],['Sex','A/B',1],['Sáb','Casa + bike',0],['Dom','Descanso',0]];
  return `<section class="list"><div class="dayhead"><div><h2>Guia</h2><p>${last?`Último treino: ${last.d} em ${br(last.date)} · `:''}Próximo: ${nextGym()}</p></div></div>
  ${notices('G')}
  ${protHTML()}
  ${bwHTML()}
  ${evoHTML()}
  ${remHTML()}
  <div class="note"><h3>Como o app ajusta a carga</h3><ul>
  <li>Cada exercício tem uma faixa de repetições (ex.: 8–12). Em cada série, ajuste o peso e quantas repetições você fez e toque em <b>Feita</b>.</li>
  <li>Ao terminar a última série, o app olha a <b>1ª série</b>, que é a mais forte:
   <br>⬆ <b>Fez o máximo da faixa em todas as séries</b> → sobe cerca de 5% de carga. Se passou 3 ou mais do máximo, sobe mais, calculado pelas repetições.
   <br>= <b>Ficou dentro da faixa</b> → mantém a carga e tenta +1 repetição.
   <br>⬇ <b>1ª série abaixo do mínimo</b> → baixa 1 degrau. Se ficou 3 ou mais abaixo, baixa mais.</li>
  <li>No próximo treino, a 1ª série já vem com a carga sugerida. Cada série seguinte repete o peso da anterior; mude qualquer uma com + e − ou digitando.</li>
  <li>Aumento sugerido: cerca de 5% da carga. Botões + e −: halteres 1 kg; leg press, hack, supino articulado, supino na máquina, desenvolvimento articulado e cavalinho 2 kg (trocar uma anilha de 4 por uma de 5 de cada lado); máquinas de pino e polias 5 kg. Se a máquina tiver outro degrau, digite o valor.</li>
  <li>Nas máquinas de anilha, anote sempre do mesmo jeito (por exemplo, o total dos dois lados) para o app comparar certo.</li>
  <li>Carga inicial: as que você informou (você falha por volta da 10ª repetição). Nos exercícios novos, o campo vem vazio: escolha uma carga em que consiga o mínimo da faixa.</li></ul></div>
  <div class="note"><h3>Ordem e compensação</h3><ul>
  <li><b>Ordem:</b> o treino aparece na ordem em que você fez da última vez (por exemplo, começar pelo leg press porque o supino estava ocupado).</li>
  <li><b>Correção da ordem:</b> se um exercício pequeno ficou antes do grande que usa o mesmo músculo (tríceps antes do supino, elevação lateral antes do desenvolvimento, rosca antes da puxada), o app coloca o grande antes e avisa.</li>
  <li><b>Carga:</b> se você fez o exercício grande depois do pequeno e ficou abaixo da faixa, o app não baixa a carga; ele entende que foi o cansaço da ordem.</li>
  <li><b>Compensação:</b> se você finalizar o treino sem fazer algum exercício, o próximo treino (A ou B) dá até +2 séries ao exercício do mesmo grupo e tira 1 série de exercícios pequenos. O total de séries fica igual, então o tempo não aumenta. O exercício compensado vem primeiro.</li>
  <li>Se o próximo treino não tiver exercício daquele grupo, a compensação passa para o treino seguinte.</li></ul></div>
  <div class="note"><h3>Quando o app sugere trocar</h3><ul>
  <li><b>Equilíbrio da semana:</b> se em 7 dias você não fez nenhum supino, nenhuma puxada ou nenhum stiff (por ter escolhido sempre uma alternativa), o cartão sugere voltar a ele e diz o motivo.</li>
  <li><b>Estagnou:</b> se um exercício passou o número de treinos abaixo, naquele dia, sem evoluir na carga nem nas repetições, o app sugere outra opção da lista por algumas semanas. Conta treinos daquele exercício, não dias do calendário.</li>
  <li><div class="basew"><span>Treinos sem evoluir para sugerir troca</span>${(()=>{const n=STALL();return `<div class="stp" style="width:150px"><button type="button" data-act="stall-" aria-label="Diminuir">−</button><input type="text" id="stallN" value="${n}" readonly aria-label="Treinos sem evoluir"><span class="u">treinos</span><button type="button" data-act="stall+" aria-label="Aumentar">+</button></div>`})()}</div>
   ${(()=>{const [lv,t]=stallAdvice(STALL());return `<div class="ev ${lv==='ok'?'up':'down'}" style="margin-top:6px">${t}</div>`})()}</li>
  <li>É só uma sugestão: a escolha continua sendo sua, e o ★ preferido só muda se você usar a outra opção mais vezes.</li>
  <li><b>Semana leve:</b> se 3 ou mais exercícios estagnarem ao mesmo tempo, o app sugere uma semana mais leve. Muitos treinadores usam isso; os estudos ainda não são conclusivos. Depois dela, a contagem de estagnação recomeça do zero.</li></ul></div>
  <div class="note"><h3>Repetições demais ou de menos</h3><ul>
  <li>Se a 1ª série passar 3 ou mais repetições do máximo da faixa (ex.: 70 repetições no abdominal, com faixa de 12–20), o app sugere um aumento maior de carga, calculado pelas repetições que você fez.</li>
  <li>Se ficar 3 ou mais abaixo do mínimo, sugere baixar a carga do mesmo jeito.</li>
  <li>Isso vale também durante o treino: depois de uma série fora da faixa, aparece no cartão "Usar X kg" para a próxima série.</li>
  <li>O cálculo é uma estimativa (fórmula de Epley), menos precisa com muitas repetições. Por isso a mudança tem limite por treino, e o seu histórico corrige a carga nos treinos seguintes.</li></ul></div>
  <div class="note"><h3>Abdômen definido e cintura fina</h3><ul>
  <li>O abdominal faz o músculo crescer, mas não queima a gordura da barriga. O abdômen aparece e a cintura afina quando a gordura do corpo todo diminui, na fase de definição que você planejou para depois.</li>
  <li>Por isso, trate o abdômen como os outros músculos: com carga, na faixa de 10–15 repetições. O principal agora é o <b>Abdominal na Polia</b>, onde dá para colocar peso. O Remador da sua academia não tem carga, então só progride com mais repetições; ele ficou como alternativa. O abdômen fica no Treino B (6 séries por semana).</li>
  <li>Ombro largo e costas largas também deixam a cintura com aparência mais fina, por isso o treino dá prioridade a desenvolvimento, elevação lateral, puxada e remada.</li></ul></div>
  <div class="note"><h3>Até a falha ou não?</h3><ul>
  <li><b>${FAILTXT.sim[0]}:</b> máquinas e polias de braço, ombro, peito e costas, extensora, flexora, panturrilha e abdômen. Nas séries anteriores, pare 1 repetição antes.</li>
  <li><b>${FAILTXT['1-2'][0]}:</b> supino e crucifixo com halteres, desenvolvimento com halteres, tríceps francês e testa, serrote. ${FAILTXT['1-2'][1]}</li>
  <li><b>${FAILTXT['2-3'][0]}:</b> leg press, hack, agachamento, afundo, stiff e remada cavalinho. ${FAILTXT['2-3'][1]}</li>
  <li>Os estudos mostram ganho de músculo parecido treinando perto da falha ou até a falha, mas a falha em todas as séries cansa mais. Por isso o app sugere a falha só na última série, nos exercícios seguros.</li>
  <li>Cada cartão mostra a regra daquele exercício na etiqueta ao lado do descanso.</li></ul></div>
  <div class="note"><h3>Semana sugerida</h3><div class="week">${days.map(x=>`<div class="${x[2]?'g':''}">${x[0]}<b>${x[1].length<4?x[1]:''}</b>${x[1].length<4?'':x[1]}</div>`).join('')}</div>
  <ul><li>Os treinos se alternam: <b>A → B → A → B</b>. Faltou por feriado? Continue de onde parou; a aba com a etiqueta "próximo" mostra qual é.</li>
  <li>Cada exercício aparece 2 a 3 vezes por semana. Assim o app ajusta a carga mais rápido e você aprende a técnica mais depressa.</li>
  <li><b>Prioridade na parte de cima:</b> peito, costas, ombros, braço, antebraço (rosca martelo) e abdômen. Tríceps e bíceps entram nos dois treinos (12 séries de cada por semana); o tríceps é a maior parte do braço. As pernas ficam com 1 exercício grande por dia (leg press no A, stiff no B), o suficiente para continuar evoluindo e caminhar tranquilo depois. Extensora, flexora e panturrilha saíram; se sobrar tempo, faça uma delas no fim.</li>
  <li>No seletor "Aparelho ocupado?", o app deixa marcado o exercício que você mais fez naquele lugar (★ preferido), não o último. Uma troca de vez em quando, por máquina ocupada, não muda o preferido. O preferido é separado por dia: o do Treino A não vale para o B.</li>
  <li>Peso e repetições ficam gravados por dia e por exercício escolhido. O Peck Deck feito no A tem a própria sugestão de carga, diferente do Peck Deck feito no B. Na primeira vez num dia, o app parte do registro do outro dia, se houver.</li>
  <li>Cada treino trabalha o corpo todo, e você termina todas as séries de um exercício no mesmo aparelho antes de trocar.</li>
  <li>Academia de segunda a sexta, alternando A e B (A, B, A, B, A; na semana seguinte começa pelo B). Sábado: casa e bike, se quiser. Domingo: descanso.</li>
  <li><b>Faltou?</b> O app percebe sozinho pela data. Ele continua do treino em que você parou, sem séries extras: uma falta de vez em quando não atrapalha o ganho de massa, e espremer o treino perdido no seguinte só aumenta o cansaço.</li>
  <li><b>Fez só uma parte:</b> com menos de 1/3 das séries, o treino não conta e o próximo é o mesmo. Com 1/3 ou mais, conta, e o seguinte compensa o que faltou (sem passar de 55 min).</li>
  <li><b>Dias seguidos:</b> treino na academia e em casa contam (a bike não). Com 6 dias seguidos, o app avisa para descansar no dia seguinte; com 7 ou mais, para descansar hoje.</li>
  <li><b>Próximo exercício:</b> ao terminar um exercício, o app mostra os 3 recomendados (1°, 2° e 3°), com o 1° contornado. A ordem segue: séries de compensação, exercício grande antes do pequeno do mesmo músculo, não repetir o músculo que acabou de trabalhar e, para desempatar, a sua ordem de costume.</li>
  <li><b>Treino esquecido aberto:</b> se você começou e não finalizou, no dia seguinte o app fecha sozinho com essa regra.</li>
  <li><b>Pausa de 7 dias ou mais:</b> no primeiro treino de volta, as cargas sugeridas vêm cerca de 10% menores (regra prática usada por treinadores, não um número exato de estudo).</li>
  <li><b>Feriados:</b> os nacionais são reconhecidos sozinhos, inclusive Carnaval, Sexta-feira Santa e Corpus Christi (estes dois, Carnaval e Corpus Christi, são pontos facultativos no calendário nacional; o app trata como folga). Feriados de Barueri e outras folgas: toque em "Hoje é folga" no aviso do dia.</li>
  <li>Nos dias sem academia, a bike de 30 min em ritmo moderado pode continuar. Na véspera de treino, se as pernas estiverem pesadas, pedale mais leve. Domingo é descanso total.</li></ul></div>
  <div class="note"><h3>Como usar o cronômetro</h3><ol>
  <li>Toque em <b>Feita</b> ao terminar uma série. O descanso começa sozinho.</li>
  <li>Na última série, começa o tempo de troca (90 s) e o próximo exercício fica marcado como <b>Fazendo agora</b>.</li>
  <li>Quando o descanso zera, toca um bipe e vibra. A barra fica laranja e conta quanto tempo passou.</li>
  <li>Marcou sem querer? Toque no ✓ para desfazer.</li></ol>
  <p class="flag" style="margin-top:8px">O tempo continua certo se a tela apagar, mas o bipe só toca com o app aberto na tela.</p></div>
  <div class="note"><h3>Backup</h3><p id="syncStatus">${syncText()}</p>
  <p class="flag">${inClaude()?'O histórico de pesos e treinos é salvo na sua conta Claude automaticamente. Abrindo o app em outro celular com a mesma conta, ele volta. O treino em andamento fica só neste aparelho.':'No app instalado, tudo fica salvo neste celular. Faça um backup de vez em quando e guarde no WhatsApp, e-mail ou Google Drive.'}</p>
  <div class="actions"><button type="button" class="prim" data-act="export">${inClaude()?'Baixar arquivo de backup':'Compartilhar backup'}</button><label class="ghostbtn" for="importFile" style="cursor:pointer">Restaurar de arquivo</label><input type="file" id="importFile" accept=".json,application/json" hidden></div>
  <p class="flag" id="bkMsg" style="margin-top:6px">${inClaude()?'Para passar seus dados para o app instalado: baixe o backup aqui e use "Restaurar de arquivo" lá.':'Abre o menu de compartilhar do celular para você escolher onde guardar.'}</p></div>
  <div class="note"><h3>Alimentação</h3><ul>
  <li><b>Pão com ovo sem margarina:</b> ótima troca. Use 2 a 3 ovos.</li>
  <li><b>Lanche das 15h:</b> 1 a 2 bananas. Se tiver leite em casa, um copo junto ajuda na proteína.</li>
  <li><b>Yakult:</b> tem pouca proteína (cerca de 1 g por frasco; confira no rótulo). Pode manter, mas um copo de leite rende bem mais.</li>
  <li><b>Chás:</b> camomila, erva-doce, hortelã e cidreira não têm cafeína.</li>
  <li><b>Açúcar no chá:</b> 1 a 2 canecas com 1 colher de chá cada dão cerca de 5 a 10 g de açúcar por dia (uns 20 a 40 kcal; valores aproximados). Isso não atrapalha o ganho de massa. Se quiser tirar, use meia colher por 2 semanas e depois um quarto; o paladar costuma se acostumar.</li>
  <li><b>Jantar:</b> ovos, sardinha, atum ou frango, mais arroz ou pão.</li>
  <li><b>Meta estimada:</b> 140 a 160 g de proteína por dia.</li></ul></div>

    armed=null;S.hist=[];S.prog={};S.exlog={};S.varCount={};S.order={};S.debt=null;S.bw=[];S.prot={};S.deload=null;touch();stopTimer();render()}
});
content.addEventListener('change',e=>{
  const t=e.target,d=dayById(S.view);if(!d)return;
  if(t.matches('select[data-act=var]')){if(P_(d.id).sets[+t.dataset.i])return;P_(d.id).vars[+t.dataset.i]=t.value;const p=P_(d.id);delete p.w[+t.dataset.i];save();renderCard(d,+t.dataset.i);return}
  if(t.matches('input[data-act]')){const f=t.dataset.act,i=+t.dataset.i,s=+t.dataset.s,v=num(t.value);
    setVal(d,f,i,s,v);
    if(f==='w')setTimeout(()=>renderCard(d,i),0);else t.value=kg(v)}
});
content.addEventListener('focusin',e=>{if(e.target.matches('input[data-act]'))setTimeout(()=>{try{e.target.select()}catch(_){}},0)});
// ---- conta Claude (histórico) e backup em arquivo ----
let DB=null,DOC=null,syncState='off',syncAt=0,syncT=null;
const SYNC=['exlog','hist','varCount','order','debt','off','bw','deload','deloadSnooze','stallReset','win','wakeAt','rem','lastBackup','firstUse','prot','stallN'];
const pickSync=()=>{const o={};SYNC.forEach(k=>o[k]=S[k]);return o};
function applySync(o){SYNC.forEach(k=>{if(o[k]!==undefined)S[k]=o[k]});S.exlog=S.exlog||{};S.hist=S.hist||[];S.varCount=S.varCount||{};S.order=S.order||{};S.off=S.off||[];S.bw=S.bw||[];S.rem=S.rem||{};S.prot=S.prot||{}}
function syncText(){if(!inClaude())return 'Salvo neste celular.';return syncState==='ok'?`Salvo na sua conta ✓${syncAt?' · '+new Date(syncAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''}`:syncState==='saving'?'Salvando na sua conta…':syncState==='err'?'Não consegui salvar na conta agora. Seus dados continuam neste celular; baixe um backup.':'Salvo neste celular. A cópia na conta não está disponível agora.'}
function showSync(){const el=$('syncStatus');el&&(el.textContent=syncText())}
function touch(){S.updatedAt=Date.now();save();if(DOC){clearTimeout(syncT);syncT=setTimeout(push,1500)}}
async function push(){if(!DOC)return;syncState='saving';showSync();
  try{await DOC.set({data:JSON.stringify(pickSync()),stallN:STALL(),updatedAt:S.updatedAt});syncState='ok';syncAt=Date.now()}catch(e){syncState='err'}showSync()}
(async()=>{try{
  if(!window.claude||!claude.use)return;
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return;const uid=await user.id();if(!uid)return;
  DB=db;DOC=db.doc('data/users/'+uid+'/treino');
  const snap=await Promise.race([DOC.get(),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),10000))]);
  const r=snap.exists?snap.data():null;
  if(r&&(+r.updatedAt||0)>(S.updatedAt||0)){try{if(r.data)applySync(JSON.parse(r.data));else{S.exlog=JSON.parse(r.exlog||'{}');S.hist=JSON.parse(r.hist||'[]');S.varCount=JSON.parse(r.varCount||'{}')}if(r.stallN)S.stallN=+r.stallN;S.updatedAt=+r.updatedAt;save();render()}catch(e){}syncState='ok';syncAt=+r.updatedAt}
  else if((S.updatedAt||0)>((r&&+r.updatedAt)||0))await push();
  else{syncState='ok';syncAt=r?+r.updatedAt:0}
  showSync();
}catch(e){syncState=DOC?'err':'off';showSync()}})();
const inClaude=()=>!window.STANDALONE;
async function exportFile(){
  const data=JSON.stringify({app:'treino-abcd',v:4,exportado:new Date().toISOString(),...pickSync(),updatedAt:S.updatedAt},null,1);
  const name='backup-treino-'+today()+'.json',msg=$('bkMsg');const okBackup=()=>{S.lastBackup=today();touch();if(S.view!=='G')render()};
  if(inClaude()){
    try{const dl=await window.claude.use('downloads');if(!dl){msg.textContent='Não dá para baixar arquivos nesta tela.';return}
      await dl.save({filename:name,data});okBackup();msg&&(msg.textContent='Backup pronto.')}
    catch(e){msg&&(msg.textContent=e&&e.code==='declined'?'Download cancelado.':'Não consegui gerar o arquivo agora. Tente de novo em instantes.')}
    return}
  // App instalado ou navegador: abre o menu de compartilhar do celular; se não houver, baixa o arquivo.
  try{const f=new File([data],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Backup do treino'});okBackup();msg&&(msg.textContent='Backup compartilhado.');return}}
  catch(e){if(e&&e.name==='AbortError'){msg&&(msg.textContent='Compartilhamento cancelado.');return}}
  try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);okBackup();msg&&(msg.textContent='Arquivo salvo em Downloads.')}
  catch(e){msg&&(msg.textContent='Não consegui gerar o arquivo.')}
}
document.addEventListener('change',e=>{if(e.target.id!=='importFile')return;const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{const msg=$('bkMsg');try{const o=JSON.parse(rd.result);if(o.app!=='treino-abcd'||typeof o.exlog!=='object')throw 0;
    applySync(o);S.hist=Array.isArray(S.hist)?S.hist:[];if(o.stallN)S.stallN=+o.stallN;touch();render();$('bkMsg').textContent='Backup restaurado.'}catch(_){msg&&(msg.textContent='Esse arquivo não é um backup deste app.')}};rd.readAsText(f)});

// ---- checklist de proteína ----
const PROT=['Ovos no café','Frango ou carne no almoço','Proteína no jantar (ovo, sardinha, atum, frango)','Lanche com proteína (leite, iogurte, ovo, amendoim)'];
function protWeek(){const mon=monday(today());let ok=0,days=0;for(let k=0;k<7;k++){const s=addD(mon,k);if(s>today())break;days++;const a=S.prot[s];if(a&&a.reduce((x,y)=>x+y,0)>=3)ok++}return [ok,days]}
function protHTML(){const a=S.prot[today()]||[0,0,0,0],n=a.reduce((x,y)=>x+y,0),[ok,days]=protWeek();
  return `<div class="note" id="protBox"><h3>Proteína de hoje</h3><div class="chk4">${PROT.map((t,k)=>`<button type="button" class="pchk${a[k]?' on':''}" data-act="prot" data-k="${k}" aria-pressed="${!!a[k]}"><span>${a[k]?'✓':''}</span>${t}</button>`).join('')}</div>
  <p class="flag" style="margin-top:8px">${n>=3?'<b>Meta de hoje batida.</b> ':`Faltam ${3-n} para a meta de hoje (3 de 4). `}Nesta semana: meta batida em ${ok} de ${days} dia${days>1?'s':''}. É uma referência simples, não um cálculo exato de proteína.</p></div>`}
function renderProt(){const el=$('protBox');if(el)el.outerHTML=protHTML()}

// ---- peso corporal ----
// Ritmo pela reta dos registros das últimas 4 semanas (kg por semana).
function bwRate(){const L=S.bw.filter(x=>x.date>=addD(today(),-35));if(L.length<2)return null;const span=diffD(L[0].date,L[L.length-1].date);if(span<7)return null;
  const xs=L.map(x=>diffD(L[0].date,x.date)),ys=L.map(x=>+x.kg),mx=xs.reduce((a,b)=>a+b,0)/xs.length,my=ys.reduce((a,b)=>a+b,0)/ys.length;
  let nu=0,de=0;xs.forEach((x,k)=>{nu+=(x-mx)*(ys[k]-my);de+=(x-mx)*(x-mx)});return {rate:de?nu/de*7:0,span}}
function bwAdvice(){const r=bwRate();if(!r)return ['','Registre pelo menos 2 pesagens com 1 semana de diferença para o app calcular o ritmo.'];
  const v=r.rate.toLocaleString('pt-BR',{maximumFractionDigits:2,signDisplay:'always'});
  if(r.rate>0.5)return ['down',`Ganhando ${v} kg por semana: rápido demais, a tendência é acumular mais gordura. Reduza os beliscos (bolachas) e mantenha a proteína.`];
  if(r.rate<0.25){if(r.span<21)return ['',`Ritmo atual: ${v} kg por semana. Ainda cedo para concluir; o app avalia com 3 semanas de registros.`];
    return ['down',`Ganhando ${v} kg por semana há ${Math.round(r.span/7)} semanas: devagar demais para crescer. Acrescente um lanche por dia (ex.: banana com leite ou 2 ovos).`]}
  return ['up',`Ganhando ${v} kg por semana: no ritmo certo (0,25 a 0,5 kg por semana).`]}
function bwHTML(){const L=S.bw.slice(-6).reverse(),[lv,t]=bwAdvice();
  return `<div class="note"><h3>Peso corporal</h3><p class="flag">Toda segunda de manhã, em jejum, depois de ir ao banheiro. Referência de ganho para massa com pouca gordura: 0,25 a 0,5 kg por semana (faixa usual, não um valor exato para você).</p>
  <div class="bwrow"><input type="text" inputmode="decimal" id="bwInput" placeholder="kg" aria-label="Peso em kg"><input type="date" id="bwDate" value="${today()}" max="${today()}" aria-label="Data da pesagem"><button type="button" class="prim" data-act="bwsave" data-src="bwInput">Salvar</button></div>
  <div class="ev ${lv}" style="margin-top:8px">${t}</div>
  ${L.length?`<div class="tw"><table><thead><tr><th>Data</th><th>Peso</th><th></th></tr></thead><tbody>${L.map(x=>`<tr><td>${br(x.date)}/${x.date.slice(2,4)}</td><td>${kg(x.kg)} kg</td><td><button type="button" class="linkbtn" data-act="bwdel" data-date="${x.date}">apagar</button></td></tr>`).join('')}</tbody></table></div>`:''}</div>`}

// ---- horário de treino e lembretes na agenda ----
const REM={
 treino:{name:'Treino A/B – academia',days:'MO,TU,WE,TH,FR',at:()=>S.win&&S.win.a,end:()=>S.win&&S.win.b,desc:'Hora do treino. Abra o app Treino A/B.'},
 peso:{name:'Pesagem – Treino A/B',days:'MO',at:()=>S.wakeAt,end:()=>{const m=mins(S.wakeAt)+10;return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')},desc:'Pese-se em jejum, depois de ir ao banheiro. À tarde, anote o peso no app.'}};
// Próximo dia válido (a partir de hoje) para começar a repetição.
function firstDate(days,at){const map={SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6},ok=days.split(',').map(x=>map[x]),t=new Date();
  for(let k=0;k<8;k++){const c=new Date(t.getFullYear(),t.getMonth(),t.getDate()+k);const [h,m]=at.split(':').map(Number);c.setHours(h,m,0,0);if(ok.includes(c.getDay())&&c>t)return c}return t}
const stamp=(c,hm)=>{const [h,m]=hm.split(':');return c.getFullYear()+String(c.getMonth()+1).padStart(2,'0')+String(c.getDate()).padStart(2,'0')+'T'+h+m+'00'};
function gcalLink(k){const r=REM[k],at=r.at(),en=r.end();if(!HM.test(at||'')||!HM.test(en||''))return '';const c=firstDate(r.days,at);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(r.name)+'&dates='+stamp(c,at)+'/'+stamp(c,en)+'&ctz=America/Sao_Paulo&details='+encodeURIComponent(r.desc)+'&recur='+encodeURIComponent('RRULE:FREQ=WEEKLY;BYDAY='+r.days)}
function icsText(k){const r=REM[k],at=r.at(),en=r.end(),c=firstDate(r.days,at);
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Treino AB//PT','BEGIN:VEVENT','UID:treino-ab-'+k+'@app','DTSTAMP:'+stamp(new Date(),'00:00'),'DTSTART:'+stamp(c,at),'DTEND:'+stamp(c,en),'RRULE:FREQ=WEEKLY;BYDAY='+r.days,'SUMMARY:'+r.name,'DESCRIPTION:'+r.desc,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+r.name,'TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n')}
async function shareICS(k){const name=(k==='treino'?'lembrete-treino':'lembrete-pesagem')+'.ics',data=icsText(k),msg=$('remMsg-'+k);
  try{const f=new File([data],name,{type:'text/calendar'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:REM[k].name});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const u=URL.createObjectURL(new Blob([data],{type:'text/calendar'})),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);msg&&(msg.textContent='Arquivo salvo em Downloads. Abra com a sua agenda.')}catch(e){msg&&(msg.textContent='Não consegui gerar o arquivo.')}}
function remBlock(k){const r=REM[k],on=!!(S.rem[k]&&S.rem[k].on),saved=S.rem[k]&&S.rem[k].at,cur=r.at(),valid=HM.test(cur||'');
  let h=`<div class="remrow"><label class="tog"><input type="checkbox" data-rem="${k}" ${on?'checked':''}><span></span>${k==='treino'?'Lembrete do treino (segunda a sexta, no início do horário)':'Lembrete da pesagem (segunda de manhã)'}</label>`;
  if(on){
    if(!valid)h+=`<p class="flag">Preencha o horário acima para criar o lembrete.</p>`;
    else{if(saved&&saved!==cur)h+=`<div class="ev down">O lembrete na agenda ainda está às ${saved}. Apague o antigo ("${r.name}") e crie o novo às ${cur}.</div>`;
      h+=`<div class="actions" style="margin-top:6px"><a class="prim" href="${gcalLink(k)}" target="_blank" rel="noopener" data-remmade="${k}">Criar na Google Agenda ↗</a>${inClaude()?'':`<button type="button" class="ghostbtn" data-act="remics" data-k="${k}">Arquivo para outra agenda</button>`}</div>
      <p class="flag" id="remMsg-${k}">Precisa de internet só para criar. A Google Agenda costuma usar o aviso padrão dela (geralmente 30 min antes); ao salvar, mude a notificação para "No horário do evento".</p>`}
  }else if(saved)h+=`<div class="ev">Desligado no app. Para parar de receber, apague na agenda: abra o evento "<b>${r.name}</b>", toque em ⋮ (ou na lixeira), Excluir, "Todos os eventos". <button type="button" class="linkbtn" data-act="remclear" data-k="${k}">Já apaguei</button></div>`;
  return h+'</div>'}
function remHTML(){const w=S.win||{a:'',b:''};
  return `<div class="note" id="remBox"><h3>Horário e lembretes</h3>
  <div class="basew"><span>Horário do treino (24h)</span><span class="hm"><input type="text" inputmode="numeric" maxlength="5" placeholder="16:08" id="winA" data-hm="a" value="${w.a||''}" aria-label="Início do treino"> às <input type="text" inputmode="numeric" maxlength="5" placeholder="17:03" id="winB" data-hm="b" value="${w.b||''}" aria-label="Fim do treino"></span></div>
  <p class="flag">Os avisos do app (pesagem, dia de treino, semana leve, backup) aparecem dentro desse horário. ${S.win&&HM.test(S.win.a||'')&&HM.test(S.win.b||'')?'':'Enquanto não preencher, eles aparecem a qualquer hora.'}</p>
  <div class="basew" style="margin-top:8px"><span>Horário da pesagem (24h)</span><span class="hm"><input type="text" inputmode="numeric" maxlength="5" placeholder="06:30" id="wakeAt" data-hm="w" value="${S.wakeAt||''}" aria-label="Horário da pesagem"></span></div>
  <p class="flag">Um app instalado pelo navegador não consegue avisar com ele fechado. Para isso, ligue os lembretes abaixo: eles ficam na agenda do celular, que avisa mesmo sem internet.</p>
  ${remBlock('treino')}${remBlock('peso')}</div>`}
// Digita 1608 → 16:08
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.hm)return;let v=t.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+':'+v.slice(2);t.value=v});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.hm){const v=t.value;if(v&&!HM.test(v)){t.setCustomValidity('Use o formato 00:00');t.reportValidity&&t.reportValidity();return}t.setCustomValidity('');
    if(t.dataset.hm==='w')S.wakeAt=v;else{S.win=S.win||{a:'',b:''};S.win[t.dataset.hm]=v}touch();setTimeout(()=>{const y=window.scrollY;render();window.scrollTo(0,y)},0);return}
  if(t.dataset&&t.dataset.rem){const k=t.dataset.rem;S.rem[k]=S.rem[k]||{};S.rem[k].on=t.checked;touch();setTimeout(()=>{const y=window.scrollY;render();window.scrollTo(0,y)},0)}});
document.addEventListener('click',e=>{const a=e.target.closest('a[data-remmade]');if(!a)return;const k=a.dataset.remmade;S.rem[k]=S.rem[k]||{};S.rem[k].on=true;S.rem[k].at=REM[k].at();touch();setTimeout(()=>{const y=window.scrollY;render();window.scrollTo(0,y)},300)});

autoClose();
render();
// Ao voltar para o app num novo dia, fecha treino esquecido e atualiza os avisos.
let _day=today();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&today()!==_day){_day=today();autoClose();render()}});

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
